<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Pack Templates — Enya Studios</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="tech-packs" data-nav="resources" data-min-tier="1" data-chat>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="container page-head">
      <p class="eyebrow">Tech pack templates</p>
      <h1 class="h1">Tech Pack Template Gallery</h1>
      <p class="lede">Choose a template, open it in Canva and make it yours, a bit like picking a presentation template. Each one is built to send straight to your factory.</p>
      <div id="planNote"></div>

      <div class="toolbar">
        <div class="tabs" id="tpTabs" role="group" aria-label="Filter by garment type"></div>
        <div class="search">
          <span data-icon="search"></span>
          <label class="sr-only" for="tpSearch">Search templates</label>
          <input class="input" id="tpSearch" type="search" placeholder="Search templates" autocomplete="off">
        </div>
      </div>
      <div class="grid grid-3" id="tpGrid"></div>
      <p class="empty" id="tpEmpty" hidden>No templates match that search.</p>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/social-icons.js"></script>
  <script src="data/plans.js"></script>
  <script src="js/app.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/content.js"></script>
  <script src="js/techpacks.js"></script>
</body>
</html>
